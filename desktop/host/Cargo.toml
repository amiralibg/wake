[package]
name = "wake"
version = "0.3.0"
edition = "2021"
publish = false
description = "Wake: a browser of threads and trails"

[build-dependencies]
winresource = "0.1"

[dependencies]
wry = { version = "0.57", features = ["devtools", "linux-body"] }
tao = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rust-embed = "8"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
open = "5"
sha2 = "0.10"
url = "2"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha1 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }
minisign-verify = "0.3"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
gtk = "0.18"
glib = "0.18"
gdk = "0.18"
cairo-rs = { version = "0.18", features = ["png"] }
javascriptcore-rs = { version = "=1.1.2", features = ["v2_28"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Foundation", "Win32_System_Com_StructuredStorage", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_UI_Input_KeyboardAndMouse"] }
windows-core = "0.62"

[profile.release]
lto = true
codegen-units = 1
strip = true
